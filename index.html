	<script>
document.addEventListener('DOMContentLoaded', function() {
  // Create lightbox
  const lightbox = document.createElement('div');
  lightbox.className = 'lightbox';
  const lightboxImg = document.createElement('img');

  const closeBtn = document.createElement('div');
  closeBtn.className = 'lightbox-close';
  closeBtn.innerHTML = '×';

  const controls = document.createElement('div');
  controls.className = 'lightbox-controls';
  controls.innerHTML = '<span class="zoom-in">+</span><span class="zoom-out">−</span>';

  lightbox.appendChild(lightboxImg);
  lightbox.appendChild(closeBtn);
  lightbox.appendChild(controls);
  document.body.appendChild(lightbox);

  // Current zoom level
  let currentZoom = 3; // Default zoom level
  const maxZoom = 3;   // Maximum zoom level

  // Add click events to all images
  const images = document.querySelectorAll('.inner img:not(.lightbox img)');
  images.forEach(function(img) {
    img.addEventListener('click', function() {
      lightboxImg.src = this.src;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
      currentZoom = maxZoom; // Start at maximum zoom
      lightboxImg.style.transform = `scale(${currentZoom})`;
    });
  });

  // Zoom controls
  document.querySelector('.zoom-in').addEventListener('click', function(e) {
    e.stopPropagation();
    currentZoom += 0.2;
    if (currentZoom > 3) currentZoom = 3;
    lightboxImg.style.transform = `scale(${currentZoom})`;
  });

  document.querySelector('.zoom-out').addEventListener('click', function(e) {
    e.stopPropagation();
    currentZoom -= 0.2;
    if (currentZoom < 0.5) currentZoom = 0.5;
    lightboxImg.style.transform = `scale(${currentZoom})`;
  });

  // Close lightbox on click
  lightbox.addEventListener('click', function() {
    this.classList.remove('active');
    document.body.style.overflow = '';
  });

  // Prevent clicks on the image from closing the lightbox
  lightboxImg.addEventListener('click', function(e) {
    e.stopPropagation();
  });

  // Close on escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }
  });
});
</script>
